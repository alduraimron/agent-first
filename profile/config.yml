# Loaded only by the explicitly activated agent-first profile.
# Controlled YOLO: ordinary tiers are autonomous; explicit policies still apply.
# Bash patterns and restricted-folder prompts are not OS or eval containment.
tools:
  approvalMode: yolo
  approval:
    debug: deny
    github: deny
    checkpoint: deny
    rewind: deny
    security_scan: deny
    manage_skill: deny
    computer.control: deny
  restrictedFolders:
    - ~/.omp
    - ~/.pi
    - ~/.ssh
    - ~/.aws
    - ~/.gnupg
    - ~/.config
    - ~/.azure
    - ~/.kube
    - ~/.docker
    - ~/.o2
    - ~/Documents/work
    - /etc
    - /usr
    - /opt
bash:
  direnv: off
  gitGuard: true
  allowCompoundCommands: false
  patterns:
