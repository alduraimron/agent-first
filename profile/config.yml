task:
  batch: true
  structured: true
  maxConcurrency: 2
  maxRecursionDepth: 1
  maxRuntimeMs: 240000
  autoParallel: off
  perCallModel: off
  prewalk: false
  disabledAgents: [scout, security-reviewer, task, sonic]
  isolation:
    enabled: false
    apply: false
    merge: patch
isolation:
  backend: auto
skills:
  enabled: true
  enablePiUser: true
  enablePiProject: false
  enableAgentsUser: false
  enableAgentsProject: false
  enableClaudeUser: false
  enableClaudeProject: false
  enableCodexUser: false
  manualSkills:
    - principle-*
  includeSkills:
    - af-engineering
    - af-design
    - af-database
    - af-frontend
    - af-testing
    - af-security
    - af-performance
    - af-operations
    - af-context
