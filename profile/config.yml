# Loaded only by the explicitly activated agent-first profile.
# YOLO + Ask When Needed: routine tiers are autonomous; consequential commands prompt.
# Ordered command rules are approval controls, not filesystem/process/network containment.
tools:
  approvalMode: yolo
  approval:
    debug: deny
    github: deny
    checkpoint: deny
    rewind: deny
    security_scan: deny
    manage_skill: deny
    computer.control: deny
  restrictedFolders:
    - ~/.omp
    - ~/.pi
    - ~/.ssh
    - ~/.aws
    - ~/.gnupg
    - ~/.config
    - ~/.azure
    - ~/.kube
    - ~/.docker
    - ~/.o2
    - ~/Documents/work
    - /etc
    - /usr
    - /opt
